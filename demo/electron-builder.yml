# electron-builder 打包配置（M4）
#
# 只装构建产物，不装 node_modules：渲染层被 vite 打成了 dist/，
# 主进程与预加载被 esbuild 打成了 dist-electron/，运行时不再需要任何依赖包。

appId: com.aiweekly.desktop
productName: AI周报
copyright: Copyright © 2026 AI 周报

directories:
  output: release
  buildResources: build

# 产物里只放这三样，包体积因此只有 Electron 本身那么大
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# 没有任何原生模块，跳过 rebuild，打包快很多
npmRebuild: false

# 直接用 node_modules 里已经装好的那份 Electron（复制过去），不走默认的
# 「下载 zip → 解压到 win-unpacked.tmp → 改名为 win-unpacked」。
# 本机上那一步稳定失败：刚解压出来的 electron.exe 还被句柄占着，改名报 EPERM。
# 换机器后这行也可以留着 —— 少一次 150MB 的解压，本来就更划算。
electronDist: node_modules/electron/dist

win:
  target:
    - target: nsis
      arch:
        - x64
  # 图标：build/icon.ico（由 scripts/make-icon.mjs 手写 PNG + ICO 编码生成，
  # 含 16/24/32/48/64/128/256 七个尺寸，无第三方图形依赖）。
  #
  # 这里**必须直接给 .ico**，不能给 PNG 让它自动转：自动转换会另起一个 node
  # 子进程跑 icons-bundle 的 icon-tool.js，而本机这个环境里子进程分不到内存
  # （堆长到 5MB 就 OOM，放大 NODE_OPTIONS 也没用），`npm run dist` 会稳定挂在
  # 那一步。给现成的 .ico，打包全程就没有额外的子进程了。
  icon: build/icon.ico
  artifactName: ai-weekly-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI周报
