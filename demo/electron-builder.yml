# electron-builder 打包配置（M4）
#
# 只装构建产物，不装 node_modules：渲染层被 vite 打成了 dist/，
# 主进程与预加载被 esbuild 打成了 dist-electron/，运行时不再需要任何依赖包。

appId: com.aiweekly.desktop
productName: AI周报
copyright: Copyright © 2026 AI 周报

directories:
  output: release
  buildResources: build

# 产物里只放这三样，包体积因此只有 Electron 本身那么大
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# 没有任何原生模块，跳过 rebuild，打包快很多
npmRebuild: false

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ai-weekly-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI周报
